name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app tests scripts
      - run: uv run pytest --cov=app --cov-report=term-missing
      - name: Check openapi.json is up to date
        run: |
          uv run python -m scripts.export_openapi
          if ! git diff --exit-code -- ../openapi.json; then
            echo "::error file=openapi.json::openapi.json is out of date. Run 'uv run python -m scripts.export_openapi' in backend/, then 'npm run gen:api' in frontend/, and commit both files."
            exit 1
          fi

  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files for secrets
        run: python3 backend/scripts/check_no_secrets.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check src/api/schema.d.ts is up to date
        run: |
          npm run gen:api
          if ! git diff --exit-code -- src/api/schema.d.ts; then
            echo "::error file=frontend/src/api/schema.d.ts::src/api/schema.d.ts is out of date with openapi.json. Run 'npm run gen:api' in frontend/ and commit the result."
            exit 1
          fi

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway database of this job only; not a secret.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: personaldolar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/personaldolar
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -m integration

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t personaldolar:ci .
      - name: Smoke test the image against Postgres
        run: |
          docker network create ci-net
          # Throwaway database of this job only; not a secret.
          docker run -d --name ci-db --network ci-net \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=personaldolar postgres:17
          for _ in $(seq 1 30); do
            docker exec ci-db pg_isready -U postgres && break
            sleep 2
          done
          docker run -d --name ci-app --network ci-net -p 8000:8000 \
            -e ENVIRONMENT=production -e COOKIE_SECURE=true \
            -e JWT_SECRET=ci-only-throwaway-secret-0123456789abcdef \
            -e DATABASE_URL=postgresql+psycopg://postgres:postgres@ci-db:5432/personaldolar \
            personaldolar:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:8000/api/health | grep '"status":"ok"'
          curl -fsS http://localhost:8000/ | grep -i '<!doctype html>'
          curl -fsS http://localhost:8000/investments | grep -i '<!doctype html>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/does-not-exist)" = 404
      - name: Container logs
        if: always()
        run: docker logs ci-app || true

  # Semgrep OSS static analysis. No account, login or token: rules come from the public
  # registry packs (p/python, p/typescript, p/dockerfile, p/github-actions) and metrics are off.
  # The image is pinned (never `latest`) and must match the local run documented in
  # security-audit/semgrep-findings.md. Only severity ERROR fails the job; WARNING/INFO
  # findings are kept in the uploaded report.
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.100.0
    env:
      SEMGREP_ARGS: >-
        --metrics=off
        --config p/python --config p/typescript --config p/dockerfile --config p/github-actions
        --exclude node_modules --exclude .venv --exclude package-lock.json --exclude uv.lock
        --exclude schema.d.ts --exclude openapi.json
    steps:
      - uses: actions/checkout@v4
      - name: Scan and write the report (all severities)
        run: semgrep scan $SEMGREP_ARGS --json --json-output semgrep-report.json
      - name: Fail on severity ERROR
        run: semgrep scan $SEMGREP_ARGS --severity ERROR --error
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: ignore

  # Continuous deployment: only on pushes to main, after every test job is green.
  # Any test job added to this workflow MUST be added to `needs` below.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, backend-postgres, docker, no-secrets, semgrep]
    runs-on: ubuntu-latest
    # One deploy at a time; a running deploy is never cancelled.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Trigger deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::GitHub secret RENDER_DEPLOY_HOOK is not set. See README, Production > Continuous deployment."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 -X POST "$RENDER_DEPLOY_HOOK" -o /dev/null
          echo "Deploy requested."
      - name: Wait for healthy deploy
        env:
          RENDER_PUBLIC_URL: ${{ vars.RENDER_PUBLIC_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
          # Overridable only to simulate the failure branch locally.
          HEALTH_TIMEOUT_SECONDS: "600"
          HEALTH_INTERVAL_SECONDS: "15"
          HEALTH_INITIAL_WAIT_SECONDS: "30"
        run: |
          if [ -z "$RENDER_PUBLIC_URL" ]; then
            echo "::error::GitHub variable RENDER_PUBLIC_URL is not set (e.g. https://<name>.onrender.com). See README, Production > Continuous deployment."
            exit 1
          fi
          url="${RENDER_PUBLIC_URL%/}/api/health"
          # The old instance keeps serving while the new one builds, so a 200 is not enough:
          # wait until /api/health reports the commit that was pushed.
          # Give Render a head start before the first check.
          sleep "$HEALTH_INITIAL_WAIT_SECONDS"
          deadline=$(( $(date +%s) + HEALTH_TIMEOUT_SECONDS ))
          status=000
          last_commit=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body=$(mktemp)
            status=$(curl --silent --max-time 20 -o "$body" -w '%{http_code}' "$url" || true)
            commit=""
            if [ "$status" = "200" ]; then
              commit=$(jq -r '.commit // empty' "$body" 2>/dev/null || true)
            fi
            rm -f "$body"
            if [ -n "$commit" ]; then
              last_commit="$commit"
            fi
            echo "GET $url -> $status, commit=${commit:-n/a} (expected $EXPECTED_COMMIT)"
            if [ "$status" = "200" ] && [ "$commit" = "$EXPECTED_COMMIT" ]; then
              echo "Deploy is live on commit $EXPECTED_COMMIT."
              exit 0
            fi
            sleep "$HEALTH_INTERVAL_SECONDS"
          done
          echo "::error::$url did not report commit $EXPECTED_COMMIT within ${HEALTH_TIMEOUT_SECONDS}s (last HTTP status: $status, last commit seen: ${last_commit:-none}). Check the deploy in the Render dashboard."
          exit 1
