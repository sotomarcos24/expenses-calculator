# Render Blueprint: one Docker web service (FastAPI + built frontend) and one Postgres database.
# No secret values live here: JWT_SECRET is generated by Render and kept in its secret store.
# See the "Production" section of README.md.
services:
  - type: web
    name: personaldolar
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    # One instance only (the login rate limiter is per process). The container entrypoint
    # runs `alembic upgrade head` on every start, i.e. on every deploy.
    numInstances: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUSTED_PROXY_COUNT
        value: "3"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: personaldolar-db
          property: connectionString

databases:
  - name: personaldolar-db
    plan: free
    postgresMajorVersion: "17"
